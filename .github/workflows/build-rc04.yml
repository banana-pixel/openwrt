name: Build RC04
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        default: rc04-test
      full_wpad:
        description: Use full wpad-mbedtls (mesh, 802.11k/v)
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Config
        run: |
          cat > .config <<EOF
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_xiaomi_rc04=y
          CONFIG_PACKAGE_luci=y
          EOF
          if [ "${{ inputs.full_wpad }}" = "true" ]; then
            echo "CONFIG_PACKAGE_wpad-mbedtls=y" >> .config
            echo "# CONFIG_PACKAGE_wpad-basic-mbedtls is not set" >> .config
          fi
          make defconfig
      - name: Download sources
        run: make download -j8
      - name: Build
        run: make -j$(nproc) || make -j1 V=s
      - name: Check wpad
        run: |
          M=$(ls bin/targets/ramips/mt76x8/*.manifest)
          grep wpad "$M"
          if [ "${{ inputs.full_wpad }}" = "true" ]; then
            grep -q '^wpad-mbedtls ' "$M" || { echo "full wpad missing"; exit 1; }
            ! grep -q 'wpad-basic' "$M" || { echo "basic wpad present"; exit 1; }
          else
            grep -q '^wpad-basic-mbedtls ' "$M" || { echo "default wpad missing"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rc04-firmware
          path: bin/targets/ramips/mt76x8/*
